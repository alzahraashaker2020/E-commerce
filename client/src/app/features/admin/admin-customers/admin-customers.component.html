<h1 class="admin-title">Customers</h1>

<div class="loading" *ngIf="loading">Loading…</div>
<div class="alert alert-error" *ngIf="error">{{ error }}</div>

<div class="card" *ngIf="!loading">
  <table class="data" *ngIf="customers.length">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Phone</th><th>Marketing consent</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.fullName }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone || '—' }}</td>
        <td>
          <span class="badge" [class.badge-ok]="c.marketingConsent" [class.badge-muted]="!c.marketingConsent">
            {{ c.marketingConsent ? 'Opted in' : 'No' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="muted" *ngIf="!customers.length">No customers.</p>
</div>
