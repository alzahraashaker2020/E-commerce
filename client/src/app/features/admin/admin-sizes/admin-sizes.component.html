<h1 class="admin-title">Sizes</h1>

<div class="loading" *ngIf="loading">Loading…</div>
<div class="alert alert-error" *ngIf="error">{{ error }}</div>

<!-- Create / edit form -->
<div class="card form-card">
  <h3>{{ editing ? 'Edit size' : 'Create size' }}</h3>
  <div class="form-grid">
    <div class="field"><label>Name</label><input name="name" [(ngModel)]="form.name" placeholder="Small" /></div>
    <div class="field"><label>Display order</label><input name="displayOrder" type="number" [(ngModel)]="form.displayOrder" /></div>
    <div class="field">
      <label>Active</label>
      <select name="active" [(ngModel)]="form.isActive">
        <option [ngValue]="true">Yes</option>
        <option [ngValue]="false">No</option>
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" (click)="save()">{{ editing ? 'Save' : 'Create' }}</button>
    <button class="btn btn-outline" *ngIf="editing" (click)="cancel()">Cancel</button>
  </div>
</div>

<!-- Size table -->
<div class="card">
  <table class="data" *ngIf="sizes.length">
    <thead>
      <tr><th>Name</th><th>Order</th><th>Active</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of sizes">
        <td><strong>{{ s.name }}</strong></td>
        <td>{{ s.displayOrder }}</td>
        <td><span class="badge" [class.badge-ok]="s.isActive" [class.badge-muted]="!s.isActive">{{ s.isActive ? 'Yes' : 'No' }}</span></td>
        <td class="row-actions">
          <button class="btn btn-outline btn-sm" (click)="startEdit(s)">Edit</button>
          <button class="btn btn-danger btn-sm" (click)="remove(s)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="muted" *ngIf="!sizes.length && !loading">No sizes.</p>
</div>
