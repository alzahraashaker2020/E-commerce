<h1 class="merchant-title">{{ 'Customers' | t }}</h1>

<div class="loading" *ngIf="loading">{{ 'Loading…' | t }}</div>
<div class="alert alert-error" *ngIf="error">{{ (error) | t }}</div>

<div class="card" *ngIf="!loading">
  <div class="table-scroll" tabindex="0" role="region" [attr.aria-label]="'Data table'|t" *ngIf="customers.length"><table class="data">
    <thead>
      <tr><th>{{ 'Name' | t }}</th><th>{{ 'Email' | t }}</th><th>{{ 'Phone' | t }}</th><th>{{ 'Marketing consent' | t }}</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.fullName }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone || '—' }}</td>
        <td>
          <span class="badge" [class.badge-ok]="c.marketingConsent" [class.badge-muted]="!c.marketingConsent">
            {{ (c.marketingConsent ? 'Opted in' : 'No') | t }}
          </span>
        </td>
      </tr>
    </tbody>
  </table></div>
  <p class="muted" *ngIf="!customers.length">{{ 'No customers.' | t }}</p>
</div>
