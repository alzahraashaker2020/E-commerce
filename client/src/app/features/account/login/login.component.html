<div class="auth-wrap">
  <div class="auth-card card">
    <h1>Sign in</h1>
    <p class="muted small">Demo account: <strong>jordan&#64;demo.local</strong> / <strong>Admin&#64;12345</strong></p>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="login()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary full" type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="divider"><span>or continue with</span></div>

    <!-- Social login (Google / Facebook). Instagram is intentionally not a
         login provider — it is not a general-purpose identity provider. -->
    <div class="social-buttons">
      <button class="btn social google" (click)="social('Google')" [disabled]="submitting">
        <span class="g">G</span> Google
      </button>
      <button class="btn social facebook" (click)="social('Facebook')" [disabled]="submitting">
        <span class="f">f</span> Facebook
      </button>
    </div>

    <p class="auth-foot muted small">
      New here? <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>
