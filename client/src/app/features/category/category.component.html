<!-- Subcategory drill-down for a top-level category (e.g. "Sofa Styling"). -->
<nav class="breadcrumb">
  <a routerLink="/catalog">{{ 'Home' | t }}</a>
  <span>›</span>
  <span>{{ (category?.name) | t }}</span>
</nav>

<div class="loading" *ngIf="loading">{{ 'Loading…' | t }}</div>
<div class="alert alert-error" *ngIf="error">{{ (error) | t }}</div>

<section *ngIf="category && !loading">
  <h1 class="cat-title">{{ (category.name) | t }}</h1>
  <p class="cat-desc muted" *ngIf="category.description">{{ (category.description) | t }}</p>

  <!-- Subcategory cards -->
  <div class="sub-grid" *ngIf="category.children.length">
    <button class="sub-card" *ngFor="let sub of category.children" (click)="openSubcategory(sub)">
      <div class="sub-media">
        <img *ngIf="sub.imageUrl" [src]="sub.imageUrl | imageUrl" [alt]="(sub.name) | t" loading="lazy" />
      </div>
      <div class="sub-label">{{ (sub.name) | t }}</div>
    </button>
  </div>

  <p class="muted" *ngIf="!category.children.length">{{ 'No subcategories yet.' | t }}</p>

  <div class="shop-all-row">
    <button class="btn btn-primary" (click)="shopAll()">{{ 'Shop all' | t }} {{ (category.name) | t }}</button>
  </div>
</section>
