<div class="auth-wrap">
  <div class="auth-card card">
    <h1>Create account</h1>
    <p class="muted small">Join to track orders, save details, and leave reviews.</p>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="register()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" [(ngModel)]="fullName" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="new-password" />
        <span class="muted small">At least 6 characters.</span>
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input id="phone" name="phone" [(ngModel)]="phone" />
      </div>
      <label class="consent">
        <input type="checkbox" name="consent" [(ngModel)]="marketingConsent" />
        <span>Send me occasional offers and news</span>
      </label>

      <button class="btn btn-primary full" type="submit" [disabled]="!canSubmit">
        {{ submitting ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-foot muted small">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
