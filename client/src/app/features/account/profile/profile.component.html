<div class="loading" *ngIf="loading">Loading…</div>
<div class="alert alert-error" *ngIf="error">{{ error }}</div>
<div class="alert alert-info" *ngIf="saved">Profile saved.</div>

<form class="card profile-form" *ngIf="profile" (ngSubmit)="save()">
  <div class="field">
    <label for="fullName">Full name</label>
    <input id="fullName" name="fullName" [(ngModel)]="profile.fullName" required />
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" [value]="profile.email" disabled />
    <span class="muted small">Email can't be changed in this demo.</span>
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" [(ngModel)]="profile.phone" />
  </div>
  <label class="consent">
    <input type="checkbox" name="consent" [(ngModel)]="profile.marketingConsent" />
    <span>Receive occasional offers and news</span>
  </label>

  <button class="btn btn-primary" type="submit" [disabled]="saving">
    {{ saving ? 'Saving…' : 'Save changes' }}
  </button>
</form>
