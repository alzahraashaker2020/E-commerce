<div class="account-head spread">
  <div>
    <h1>{{ 'My Account' | t }}</h1>
    <p class="muted" *ngIf="name$ | async as name">{{ 'Signed in as' | t }} {{ (name) | t }}</p>
  </div>
  <button class="btn btn-outline btn-sm" (click)="logout()">{{ 'Sign out' | t }}</button>
</div>

<nav class="account-tabs">
  <a routerLink="/account/profile" routerLinkActive="active">{{ 'Profile' | t }}</a>
  <a routerLink="/account/orders" routerLinkActive="active">{{ 'Order history' | t }}</a>
  <a routerLink="/account/reviews" routerLinkActive="active">{{ 'My reviews' | t }}</a>
</nav>

<section class="account-body">
  <router-outlet></router-outlet>
</section>
